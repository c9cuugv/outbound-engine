[pytest]
testpaths = tests

# Tests mark themselves with @pytest.mark.asyncio (38 usages), so strict mode
# is the current behaviour — set explicitly rather than relying on the default.
asyncio_mode = strict

# All conftest fixtures are scope="function"; pinning this matches today's
# behaviour exactly and silences the pytest-asyncio deprecation warning that
# would otherwise become a breaking default change on upgrade.
asyncio_default_fixture_loop_scope = function

# The suite completes in ~67s. No test legitimately runs for a minute, so a
# per-test ceiling turns a future hang into a fast, named failure instead of a
# stalled CI job.
timeout = 60

addopts = --strict-markers
